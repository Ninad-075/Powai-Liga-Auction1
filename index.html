<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  

  <title>Powai Liga Auction Platform</title>
  <style>
    :root {
  /* Primitive Color Tokens */
  --color-white: rgba(255, 255, 255, 1);
  --color-black: rgba(0, 0, 0, 1);
  --color-cream-50: rgba(252, 252, 249, 1);
  --color-cream-100: rgba(255, 255, 253, 1);
  --color-gray-200: rgba(245, 245, 245, 1);
  --color-gray-300: rgba(167, 169, 169, 1);
  --color-gray-400: rgba(119, 124, 124, 1);
  --color-slate-500: rgba(98, 108, 113, 1);
  --color-brown-600: rgba(94, 82, 64, 1);
  --color-charcoal-700: rgba(31, 33, 33, 1);
  --color-charcoal-800: rgba(38, 40, 40, 1);
  --color-slate-900: rgba(19, 52, 59, 1);
  --color-teal-300: rgba(50, 184, 198, 1);
  --color-teal-400: rgba(45, 166, 178, 1);
  --color-teal-500: rgba(33, 128, 141, 1);
  --color-teal-600: rgba(29, 116, 128, 1);
  --color-teal-700: rgba(26, 104, 115, 1);
  --color-teal-800: rgba(41, 150, 161, 1);
  --color-red-400: rgba(255, 84, 89, 1);
  --color-red-500: rgba(192, 21, 47, 1);
  --color-orange-400: rgba(230, 129, 97, 1);
  --color-orange-500: rgba(168, 75, 47, 1);

  /* RGB versions for opacity control */
  --color-brown-600-rgb: 94, 82, 64;
  --color-teal-500-rgb: 33, 128, 141;
  --color-slate-900-rgb: 19, 52, 59;
  --color-slate-500-rgb: 98, 108, 113;
  --color-red-500-rgb: 192, 21, 47;
  --color-red-400-rgb: 255, 84, 89;
  --color-orange-500-rgb: 168, 75, 47;
  --color-orange-400-rgb: 230, 129, 97;

  /* Background color tokens (Light Mode) */
  --color-bg-1: rgba(59, 130, 246, 0.08);
  --color-bg-2: rgba(245, 158, 11, 0.08);
  --color-bg-3: rgba(34, 197, 94, 0.08);
  --color-bg-4: rgba(239, 68, 68, 0.08);
  --color-bg-5: rgba(147, 51, 234, 0.08);
  --color-bg-6: rgba(249, 115, 22, 0.08);
  --color-bg-7: rgba(236, 72, 153, 0.08);
  --color-bg-8: rgba(6, 182, 212, 0.08);

  /* Semantic Color Tokens (Light Mode) */
  --color-background: var(--color-cream-50);
  --color-surface: var(--color-cream-100);
  --color-text: var(--color-slate-900);
  --color-text-secondary: var(--color-slate-500);
  --color-primary: var(--color-teal-500);
  --color-primary-hover: var(--color-teal-600);
  --color-primary-active: var(--color-teal-700);
  --color-secondary: rgba(var(--color-brown-600-rgb), 0.12);
  --color-secondary-hover: rgba(var(--color-brown-600-rgb), 0.2);
  --color-secondary-active: rgba(var(--color-brown-600-rgb), 0.25);
  --color-border: rgba(var(--color-brown-600-rgb), 0.2);
  --color-btn-primary-text: var(--color-cream-50);
  --color-card-border: rgba(var(--color-brown-600-rgb), 0.12);
  --color-card-border-inner: rgba(var(--color-brown-600-rgb), 0.12);
  --color-error: var(--color-red-500);
  --color-success: var(--color-teal-500);
  --color-warning: var(--color-orange-500);
  --color-info: var(--color-slate-500);
  --color-focus-ring: rgba(var(--color-teal-500-rgb), 0.4);
  --color-select-caret: rgba(var(--color-slate-900-rgb), 0.8);

  --focus-ring: 0 0 0 3px var(--color-focus-ring);
  --focus-outline: 2px solid var(--color-primary);
  --status-bg-opacity: 0.15;
  --status-border-opacity: 0.25;

  --font-family-base: "FKGroteskNeue", "Geist", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-size-xs: 11px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-md: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 20px;
  --font-size-3xl: 24px;
  --font-size-4xl: 30px;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 550;
  --font-weight-bold: 600;
  --line-height-tight: 1.2;
  --line-height-normal: 1.5;
  --letter-spacing-tight: -0.01em;

  --space-4: 4px;
  --space-8: 8px;
  --space-12: 12px;
  --space-16: 16px;
  --space-20: 20px;
  --space-24: 24px;
  --space-32: 32px;

  --radius-sm: 6px;
  --radius-base: 8px;
  --radius-md: 10px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);

  --duration-fast: 150ms;
  --duration-normal: 250ms;
  --ease-standard: cubic-bezier(0.16, 1, 0.3, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-gray-400-rgb: 119, 124, 124;
    --color-teal-300-rgb: 50, 184, 198;
    --color-gray-300-rgb: 167, 169, 169;
    --color-gray-200-rgb: 245, 245, 245;

    --color-bg-1: rgba(29, 78, 216, 0.15);
    --color-bg-2: rgba(180, 83, 9, 0.15);
    --color-bg-3: rgba(21, 128, 61, 0.15);
    --color-bg-4: rgba(185, 28, 28, 0.15);
    --color-bg-5: rgba(107, 33, 168, 0.15);
    --color-bg-6: rgba(194, 65, 12, 0.15);
    --color-bg-7: rgba(190, 24, 93, 0.15);
    --color-bg-8: rgba(8, 145, 178, 0.15);

    --color-background: var(--color-charcoal-700);
    --color-surface: var(--color-charcoal-800);
    --color-text: var(--color-gray-200);
    --color-text-secondary: rgba(var(--color-gray-300-rgb), 0.7);
    --color-primary: var(--color-teal-300);
    --color-primary-hover: var(--color-teal-400);
    --color-primary-active: var(--color-teal-800);
    --color-secondary: rgba(var(--color-gray-400-rgb), 0.15);
    --color-secondary-hover: rgba(var(--color-gray-400-rgb), 0.25);
    --color-secondary-active: rgba(var(--color-gray-400-rgb), 0.3);
    --color-border: rgba(var(--color-gray-400-rgb), 0.3);
    --color-error: var(--color-red-400);
    --color-success: var(--color-teal-300);
    --color-warning: var(--color-orange-400);
    --color-info: var(--color-gray-300);
    --color-focus-ring: rgba(var(--color-teal-300-rgb), 0.4);
    --color-btn-primary-text: var(--color-slate-900);
    --color-card-border: rgba(var(--color-gray-400-rgb), 0.2);
    --color-card-border-inner: rgba(var(--color-gray-400-rgb), 0.15);
    --color-select-caret: rgba(var(--color-gray-200-rgb), 0.8);
  }
}

@font-face {
  font-family: 'FKGroteskNeue';
  src: url('https://r2cdn.perplexity.ai/fonts/FKGroteskNeue.woff2') format('woff2');
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: var(--font-size-base);
  font-family: var(--font-family-base);
  line-height: var(--line-height-normal);
  color: var(--color-text);
  background-color: var(--color-background);
  -webkit-font-smoothing: antialiased;
}

body {
  margin: 0;
  padding: 0;
}

.app-container {
  min-height: 100vh;
  padding: var(--space-24);
}

.app-header {
  max-width: 1200px;
  margin: 0 auto var(--space-32);
  text-align: center;
}

.app-header h1 {
  font-size: var(--font-size-4xl);
  font-weight: var(--font-weight-bold);
  margin-bottom: var(--space-8);
}

.mode-selector {
  display: flex;
  gap: var(--space-8);
  justify-content: center;
  margin-top: var(--space-16);
}

.mode-btn {
  padding: var(--space-8) var(--space-16);
  border: 1px solid var(--color-border);
  background: var(--color-secondary);
  color: var(--color-text);
  border-radius: var(--radius-base);
  cursor: pointer;
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-medium);
  transition: all var(--duration-fast) var(--ease-standard);
}

.mode-btn:hover {
  background: var(--color-secondary-hover);
}

.mode-btn.active {
  background: var(--color-primary);
  color: var(--color-btn-primary-text);
  border-color: var(--color-primary);
}

.main-content {
  max-width: 1200px;
  margin: 0 auto;
}

.tabs {
  display: flex;
  gap: var(--space-8);
  margin-bottom: var(--space-24);
  border-bottom: 1px solid var(--color-border);
  overflow-x: auto;
}

.tab-btn {
  padding: var(--space-12) var(--space-16);
  background: none;
  border: none;
  color: var(--color-text-secondary);
  cursor: pointer;
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-medium);
  border-bottom: 2px solid transparent;
  transition: all var(--duration-fast) var(--ease-standard);
  white-space: nowrap;
}

.tab-btn:hover {
  color: var(--color-text);
}

.tab-btn.active {
  color: var(--color-primary);
  border-bottom-color: var(--color-primary);
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-card-border);
  border-radius: var(--radius-lg);
  padding: var(--space-24);
  margin-bottom: var(--space-24);
  box-shadow: var(--shadow-sm);
}

.card h2 {
  font-size: var(--font-size-2xl);
  font-weight: var(--font-weight-semibold);
  margin-bottom: var(--space-16);
}

.card h3 {
  font-size: var(--font-size-lg);
  font-weight: var(--font-weight-semibold);
  margin-bottom: var(--space-12);
}

.form-group {
  margin-bottom: var(--space-16);
}

.form-group label {
  display: block;
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
  margin-bottom: var(--space-8);
  color: var(--color-text);
}

.form-group input,
.form-group select {
  width: 100%;
  padding: var(--space-8) var(--space-12);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-base);
  font-size: var(--font-size-base);
  background: var(--color-surface);
  color: var(--color-text);
  transition: border-color var(--duration-fast) var(--ease-standard);
}

.form-group input:focus,
.form-group select:focus {
  outline: var(--focus-outline);
  border-color: var(--color-primary);
}

.btn {
  padding: var(--space-8) var(--space-16);
  border: none;
  border-radius: var(--radius-base);
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-standard);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-8);
}

.btn-primary {
  background: var(--color-primary);
  color: var(--color-btn-primary-text);
}

.btn-primary:hover {
  background: var(--color-primary-hover);
}

.btn-primary:active {
  background: var(--color-primary-active);
}

.btn-secondary {
  background: var(--color-secondary);
  color: var(--color-text);
  border: 1px solid var(--color-border);
}

.btn-secondary:hover {
  background: var(--color-secondary-hover);
}

.btn-danger {
  background: rgba(var(--color-red-500-rgb), 0.15);
  color: var(--color-error);
  border: 1px solid rgba(var(--color-red-500-rgb), 0.25);
}

.btn-danger:hover {
  background: rgba(var(--color-red-500-rgb), 0.25);
}

.btn-success {
  background: rgba(var(--color-teal-500-rgb), 0.15);
  color: var(--color-success);
  border: 1px solid rgba(var(--color-teal-500-rgb), 0.25);
}

.btn-success:hover {
  background: rgba(var(--color-teal-500-rgb), 0.25);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.grid {
  display: grid;
  gap: var(--space-16);
}

.grid-2 {
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
}

.grid-3 {
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
}

.player-item,
.team-item {
  background: var(--color-surface);
  border: 1px solid var(--color-card-border);
  border-radius: var(--radius-base);
  padding: var(--space-16);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.player-info,
.team-info {
  flex: 1;
}

.player-name,
.team-name {
  font-weight: var(--font-weight-semibold);
  margin-bottom: var(--space-4);
}

.player-details,
.team-details {
  font-size: var(--font-size-sm);
  color: var(--color-text-secondary);
}

.pot-badge {
  display: inline-block;
  padding: var(--space-4) var(--space-8);
  border-radius: var(--radius-sm);
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-medium);
  margin-left: var(--space-8);
}

.pot-1 {
  background: rgba(239, 68, 68, 0.15);
  color: #ef4444;
}

.pot-2 {
  background: rgba(249, 115, 22, 0.15);
  color: #f97316;
}

.pot-3 {
  background: rgba(245, 158, 11, 0.15);
  color: #f59e0b;
}

.pot-4 {
  background: rgba(34, 197, 94, 0.15);
  color: #22c55e;
}

.status-badge {
  display: inline-block;
  padding: var(--space-4) var(--space-8);
  border-radius: var(--radius-sm);
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-medium);
}

.status-sold {
  background: rgba(34, 197, 94, 0.15);
  color: #22c55e;
}

.status-unsold {
  background: rgba(239, 68, 68, 0.15);
  color: #ef4444;
}

.status-available {
  background: rgba(59, 130, 246, 0.15);
  color: #3b82f6;
}

.progress-bar {
  width: 100%;
  height: 8px;
  background: var(--color-secondary);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin-top: var(--space-8);
}

.progress-fill {
  height: 100%;
  background: var(--color-primary);
  transition: width var(--duration-normal) var(--ease-standard);
}

.auction-player {
  text-align: center;
  padding: var(--space-32);
  background: var(--color-bg-1);
  border-radius: var(--radius-lg);
  margin-bottom: var(--space-24);
}

.auction-player h2 {
  font-size: var(--font-size-3xl);
  margin-bottom: var(--space-8);
}

.auction-controls {
  display: flex;
  gap: var(--space-8);
  justify-content: center;
  margin-top: var(--space-24);
  flex-wrap: wrap;
}

.bid-buttons {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-12);
  margin-top: var(--space-24);
}

.team-btn {
  padding: var(--space-16);
  background: var(--color-surface);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-base);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-standard);
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-medium);
}

.team-btn:hover {
  border-color: var(--color-primary);
  background: var(--color-bg-1);
}

.team-btn.highest-bidder {
  border-color: var(--color-primary);
  background: rgba(var(--color-teal-500-rgb), 0.15);
  color: var(--color-primary);
}

.team-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.log-entry {
  padding: var(--space-12);
  border-left: 3px solid var(--color-border);
  margin-bottom: var(--space-8);
  background: var(--color-surface);
  border-radius: var(--radius-sm);
}

.log-entry.log-success {
  border-left-color: var(--color-success);
}

.log-entry.log-error {
  border-left-color: var(--color-error);
}

.log-entry.log-bid {
  border-left-color: var(--color-warning);
}

.log-entry.log-warning {
  border-left-color: var(--color-warning);
}

.log-timestamp {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
  margin-bottom: var(--space-4);
}

.log-message {
  font-size: var(--font-size-sm);
}

.empty-state {
  text-align: center;
  padding: var(--space-32);
  color: var(--color-text-secondary);
}

.bidder-interface {
  max-width: 600px;
  margin: 0 auto;
}

.team-selection {
  display: grid;
  gap: var(--space-12);
}

.team-selection-btn {
  padding: var(--space-16);
  background: var(--color-surface);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-base);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-standard);
  font-size: var(--font-size-lg);
  font-weight: var(--font-weight-medium);
  text-align: left;
}

.team-selection-btn:hover {
  border-color: var(--color-primary);
  background: var(--color-bg-1);
}

.current-bid-info {
  background: var(--color-bg-2);
  padding: var(--space-16);
  border-radius: var(--radius-base);
  margin-bottom: var(--space-16);
}

.bid-history {
  max-height: 200px;
  overflow-y: auto;
  margin-top: var(--space-16);
}

.bid-history-item {
  padding: var(--space-8);
  background: var(--color-surface);
  border-radius: var(--radius-sm);
  margin-bottom: var(--space-8);
  font-size: var(--font-size-sm);
}

.share-link {
  display: flex;
  gap: var(--space-8);
  align-items: center;
}

.share-link input {
  flex: 1;
  padding: var(--space-8) var(--space-12);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-base);
  background: var(--color-surface);
  color: var(--color-text);
  font-size: var(--font-size-sm);
}

.alert {
  padding: var(--space-16);
  border-radius: var(--radius-base);
  margin-bottom: var(--space-16);
}

.alert-info {
  background: rgba(59, 130, 246, 0.15);
  color: #3b82f6;
  border: 1px solid rgba(59, 130, 246, 0.25);
}

.alert-success {
  background: rgba(34, 197, 94, 0.15);
  color: #22c55e;
  border: 1px solid rgba(34, 197, 94, 0.25);
}

.alert-warning {
  background: rgba(245, 158, 11, 0.15);
  color: #f59e0b;
  border: 1px solid rgba(245, 158, 11, 0.25);
}

@media (max-width: 768px) {
  .app-container {
    padding: var(--space-16);
  }

  .tabs {
    flex-wrap: nowrap;
    overflow-x: auto;
  }

  .grid-2,
  .grid-3 {
    grid-template-columns: 1fr;
  }

  .auction-controls {
    flex-direction: column;
  }

  .bid-buttons {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>
  <div class="app-container">
    <div class="app-header">
      <h1>Powai Liga Auction Interface</h1>
      <div class="mode-selector">
        <button class="mode-btn active" id="hostModeBtn">Host Interface</button>
        <button class="mode-btn" id="bidderModeBtn">Bidder Interface</button>
      </div>
    </div>

    <div class="main-content">
      <!-- Host Interface -->
      <div id="hostInterface">
        <div class="tabs">
          <button class="tab-btn active" data-tab="setup">Setup</button>
          <button class="tab-btn" data-tab="players">Players</button>
          <button class="tab-btn" data-tab="teams">Teams</button>
          <button class="tab-btn" data-tab="auction">Auction Control</button>
          <button class="tab-btn" data-tab="results">Results</button>
          <button class="tab-btn" data-tab="log">Auction Log</button>
        </div>

        <!-- Setup Tab -->
        <div class="tab-content active" id="setup">
          <div class="card">
            <h2>Auction Settings</h2>
            <div class="form-group">
              <label>Pot 1 Threshold (Plc)</label>
              <input type="number" id="potThreshold1" value="5000" min="0">
            </div>
            <div class="form-group">
              <label>Pot 2 Threshold (Plc)</label>
              <input type="number" id="potThreshold2" value="3000" min="0">
            </div>
            <div class="form-group">
              <label>Pot 3 Threshold (Plc)</label>
              <input type="number" id="potThreshold3" value="1500" min="0">
            </div>
            <div class="form-group">
              <label>Bid Increment (Plc)</label>
              <input type="number" id="bidIncrement" value="100" min="1">
            </div>
            <button class="btn btn-primary" id="saveSettings">Save Settings</button>
          </div>

          <div class="card">
            <h2>Share Bidder Link</h2>
            <p style="margin-bottom: var(--space-16); color: var(--color-text-secondary);">Share this link with bidders to allow them to participate in the auction:</p>
            <div class="share-link">
              <input type="text" id="bidderLinkInput" readonly>
              <button class="btn btn-primary" id="copyBidderLink">Copy Link</button>
            </div>
          </div>
        </div>

        <!-- Players Tab -->
        <div class="tab-content" id="players">
          <div class="card">
            <h2>Add Player</h2>
            <div class="form-group">
              <label>Player Name</label>
              <input type="text" id="playerName" placeholder="Enter player name">
            </div>
            <div class="form-group">
